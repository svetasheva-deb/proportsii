<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажер «Пропорції»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: заголовок, три кнопки режимів (правила, відношення, пропорції), одна картка. Палітра: небо, синє чорнило, жовта плашка; крайні члени синім, середні зеленим. */
:root{
  --bg:#EEF5FD; --card:#FFFFFF; --ink:#14264A; --muted:#51617F; --line:#D5E1F2;
  --blue:#2F6FDB; --blue-soft:#E3EEFE; --yellow:#FFC93C; --red:#D7352A; --red-soft:#FDE8E6;
  --green:#1B8F55; --green-soft:#E1F5EA; --amber-soft:#FFF3CF;
  --c1:#D9E8FF; --c2:#FFE9A8; --c3:#CDEFDC;
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A33; --card:#162645; --ink:#E9EFFB; --muted:#9DB0D3; --line:#2A3C61;
  --blue:#6FA0FF; --blue-soft:#1E3260; --red:#FF7A6E; --red-soft:#4A2328;
  --green:#4FD08B; --green-soft:#17402F; --amber-soft:#4A3E16; --c1:#24407A; --c2:#5A4A12; --c3:#1C4A36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A33; --card:#162645; --ink:#E9EFFB; --muted:#9DB0D3; --line:#2A3C61;
  --blue:#6FA0FF; --blue-soft:#1E3260; --red:#FF7A6E; --red-soft:#4A2328;
  --green:#4FD08B; --green-soft:#17402F; --amber-soft:#4A3E16; --c1:#24407A; --c2:#5A4A12; --c3:#1C4A36; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.mascot{width:150px;max-width:55%;height:auto;margin-bottom:2px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 clamp(22px,5.4vw,30px)/1.25 var(--display);margin:0;text-wrap:balance}
h1 .acc{background:var(--yellow);color:#14264A;padding:0 .25em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.md{min-width:0;border:1.5px solid transparent;border-radius:10px;padding:7px 6px;cursor:pointer;text-align:center;font:600 16px/1.3 var(--body);color:var(--ink)}
.md[data-m="r"]{background:var(--c1)}.md[data-m="v"]{background:var(--c2)}.md[data-m="z"]{background:var(--c3)}
.md[aria-current="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.md:focus-visible,button.b:focus-visible,.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.q{font-size:18px;line-height:1.75;margin:0;text-wrap:pretty}
.q i,.exp i,.fb i{font-style:italic;font-weight:600}
.nw{white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.opt.good{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.ans{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:18px}
.ans input{width:88px;font:600 18px var(--body);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.ans input:focus-visible{outline:2px solid var(--blue);border-color:var(--blue)}
.ans input.good{border-color:var(--green);background:var(--green-soft)}
.ans input.bad{border-color:var(--red);background:var(--red-soft)}
.ans .sep{font-weight:700}.ans .lbl,.ans .unit{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button.b{font:600 15px var(--body);border-radius:10px;padding:10px 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme="dark"] button.main{color:#0E1A33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.main{color:#0E1A33}}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.fb.ok{background:var(--green-soft)}.fb.no{background:var(--red-soft)}.fb.hint{background:var(--amber-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.fm{display:flex;gap:12px;align-items:center}.fb.fm>div{min-width:0}.fbm{width:64px;height:64px;object-fit:contain;flex:none}
.rboard{text-align:center}.rboard img{width:150px;max-width:55%;height:auto}
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}.win img{width:180px;max-width:70%;height:auto}.win b{font-size:20px}.win p{margin:0}


/* правила */
.card h2{font:700 clamp(17px,4.8vw,20px)/1.3 var(--display);margin:0;text-align:center}
.card h3{font:600 16px/1.4 var(--body);margin:4px 0 0;color:var(--muted);text-align:center}
.rc{padding:16px 10px;gap:14px}
.rule{font-size:18px;margin:0;text-align:center;text-wrap:balance}
.big{display:grid;grid-template-columns:auto auto auto;column-gap:14px;row-gap:4px;align-items:center;width:fit-content;max-width:100%;background:var(--blue-soft);border-radius:14px;padding:12px 12px;font-size:clamp(17px,5.2vw,22px)}
.big div{white-space:nowrap}.big .ar{text-align:center}
.big{align-self:center}.legend{text-align:center}.perm,.perm .lab{text-align:center}.perm span.f{justify-self:center}
.e{color:var(--blue);font-weight:700}.m{color:var(--green);font-weight:700}
.e i,.m i{font-style:italic}
.legend{font-size:16px;color:var(--muted)}
.perm{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;padding:8px 0;border-top:1px solid var(--line);font-size:clamp(18px,5.4vw,22px)}
.perm .lab{grid-column:1/-1;font-size:15px;color:var(--muted);line-height:1.4;margin-bottom:2px}
.perm span.f{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* 40 різних завдань потрібного виду ('v' — вправи, 'z' — задачі), випадково перемішаних */
function buildPool(topic,kind,seed){
  var pool=[],seen={},rnd=makeRng(seed^0x9E3779B9);
  for(var r=0;r<150&&pool.length<200;r++){
    genTasks(topic,seed+r*104729).forEach(function(t){if(t.k===kind&&!seen[t.q]){seen[t.q]=1;pool.push(t)}});
  }
  for(var j=pool.length-1;j>0;j--){var k=Math.floor(rnd()*(j+1));var tmp=pool[j];pool[j]=pool[k];pool[k]=tmp}
  return pool.slice(0,40);
}

  function render(){
    if(mode==='r'){renderRules();return}
    var hm=document.querySelector('.mascot');if(hm)hm.hidden=false;
    var t=T[cur],locked=solved!==null,h='';
    h+='<div class="meta">'+(mode==='v'?'Вправи':'Задачі')+'</div><p class="q">'+t.q+'</p>';
    if(t.type==='choice'){
      h+='<div class="opts">'+t.opts.map(function(o,k){
        var c='opt';if(locked&&o.ok)c+=' good';else if(picked===k)c+=' bad';
        return '<button class="'+c+'" data-k="'+k+'"'+(locked?' disabled':'')+'><span class="k">'+'АБВГ'[k]+'</span><span>'+o.x+'</span></button>'}).join('')+'</div>';
    }else if(t.type==='num'){
      h+='<div class="ans"><span class="lbl">Відповідь:</span><input id="a0" inputmode="numeric" autocomplete="off" aria-label="Відповідь"'+(locked?' disabled class="good" value="'+t.ans+'"':'')+'>'+(t.unit?'<span class="unit">'+t.unit+'</span>':'')+'</div>';
    }else{
      h+='<div class="ans"><span class="lbl">Відповідь:</span><input id="a0" inputmode="numeric" autocomplete="off" aria-label="Перше число"'+(locked?' disabled class="good" value="'+t.ans[0]+'"':'')+'><span class="sep">'+t.sep+'</span><input id="a1" inputmode="numeric" autocomplete="off" aria-label="Друге число"'+(locked?' disabled class="good" value="'+t.ans[1]+'"':'')+'></div>';
    }
    h+='<div id="fb"></div><div class="btns">';
    if(!locked){h+='<button class="b main" id="check">Перевірити</button><button class="b" id="hint">Підказка</button>';if(tries>=2)h+='<button class="b" id="show">Показати відповідь</button>'}
    h+='<button class="b'+(locked?' main':'')+'" id="next">Далі</button></div>';
    $('card').className='card';$('card').innerHTML=h;
    if(locked)showExp();else if(hinted)showHint();
    bind();
  }
  function showHint(){$('fb').innerHTML='<div class="fb hint"><b>Підказка</b>'+T[cur].hint+'</div>'}
  function showExp(){$('fb').innerHTML='<div class="fb '+(solved==='shown'?'no':'ok')+'  fm"><img class="fbm" alt="" src="'+(solved==='shown'?IMG_NO:IMG_OK)+'"><div><b>'+(solved==='first'?'Правильно!':solved==='later'?'Правильно, але не з першої спроби.':'Правильна відповідь показана.')+'</b>'+T[cur].exp+'</div></div>'}
  function wrong(extra){tries++;render();$('fb').innerHTML='<div class="fb no fm"><img class="fbm" alt="" src="'+IMG_NO+'"><div><b>Не зовсім.</b>'+(extra||'Перевірте обчислення')+(hinted?'.':' або натисніть «Підказка».')+'</div></div>'}
  function finish(){$('card').className='card';$('card').innerHTML='<div class="win"><img alt="" src="'+IMG_WIN+'"><b>Серію завершено!</b><p>Так тримати!</p><button class="b main" id="again">Нова серія</button></div>';$('again').onclick=newRound}
  function bind(){
    var t=T[cur],q=function(id){return $(id)};
    q('next').onclick=function(){if(cur<T.length-1){cur++;resetTask();render()}else{finish()}};
    if(q('hint'))q('hint').onclick=function(){hinted=true;showHint()};
    if(q('show'))q('show').onclick=function(){solved='shown';render()};
    if(solved!==null)return;
    if(t.type==='choice'){
      Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
        b.onclick=function(){var k=+b.getAttribute('data-k');
          if(t.opts[k].ok){solved=tries?'later':'first';render()}
          else{picked=k;tries++;render();document.querySelectorAll('.opt')[k].className='opt bad';
            $('fb').innerHTML='<div class="fb no fm"><img class="fbm" alt="" src="'+IMG_NO+'"><div><b>Не зовсім.</b>Спробуйте інший варіант'+(hinted?'.':' або натисніть «Підказка».')+'</div></div>'}};
      });
      q('check').style.display='none';
    }else{
      var chk=function(){
        var v0=parse(q('a0').value),v1=t.type==='pair'?parse(q('a1').value):0;
        if(isNaN(v0)||isNaN(v1)){$('fb').innerHTML='<div class="fb hint"><b>Введіть число.</b>'+(t.type==='pair'?'Заповніть обидва поля.':'Можна з комою або крапкою.')+'</div>';return}
        var ok=t.type==='pair'?(v0===t.ans[0]&&v1===t.ans[1]):Math.abs(v0-t.ans)<0.011;
        if(ok){solved=tries?'later':'first';render()}
        else{wrong();['a0','a1'].forEach(function(id){if($(id))$(id).className='bad'})}
      };
      q('check').onclick=chk;
      ['a0','a1'].forEach(function(id){if(q(id))q(id).onkeydown=function(e){if(e.key==='Enter')chk()}});
      try{if(window.matchMedia&&matchMedia('(pointer:fine)').matches)q('a0').focus({preventScroll:true})}catch(e){}
    }
  }

  renderModes();
  if(mode==='r')firstExample();else newRound();
})();
</script>

</body></html>
